services:
  - type: web
    name: subdl-arabic-subtitles-addon
    env: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUBDL_API_KEY
        sync: false
      - key: SUBDL_LANGUAGES
        value: ar
      - key: MAX_SUBTITLES
        value: 0
      - key: SUBDL_TIMEOUT_MS
        value: 10000
      - key: SUBTITLE_DOWNLOAD_TIMEOUT_MS
        value: 15000
      - key: SUBTITLE_PROXY_SECRET
        generateValue: true
